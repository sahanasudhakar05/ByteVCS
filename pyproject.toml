
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytevcs"
version = "0.1.0"
description = "A Git-inspired version control system built in Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
bytevcs = "bytevcs.__main__:main"

[tool.setuptools.packages.find]
include = ["bytevcs*"]
