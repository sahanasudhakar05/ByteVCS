[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytevcs"
version = "0.2.0"
description = "A Git-inspired version control system built in Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["version-control", "git", "vcs", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/sahanasudhakar05/ByteVCS"
Repository = "https://github.com/sahanasudhakar05/ByteVCS"
Issues = "https://github.com/sahanasudhakar05/ByteVCS/issues"

[project.scripts]
bytevcs = "bytevcs.__main__:main"

[tool.setuptools.packages.find]
include = ["bytevcs*"]